name: update-and-deploy

on:
  schedule:
    - cron: "17 21 */3 * *"   # 3日おき (UTC 21:17 = 日本時間 06:17)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect results
        run: python scraper/update.py
      - name: Commit data
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update results $(date -u +%F)"
          git push
      - name: Assemble site
        run: mkdir -p _site && cp -r site/* _site/ && cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
